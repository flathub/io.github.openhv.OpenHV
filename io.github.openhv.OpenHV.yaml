app-id: io.github.openhv.OpenHV
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: openhv
rename-desktop-file: openhv.desktop
rename-appdata-file: openhv.metainfo.xml
rename-icon: openhv
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --share=network

modules:
  - shared-modules/lua5.1/lua-5.1.5.json

  - name: OpenHV
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/dotnet10/bin
      append-ld-library-path: /usr/lib/sdk/dotnet10/lib
      env:
        - DOTNET_CLI_TELEMETRY_OPTOUT=true
        - DOTNET_NOLOGO=true
      arch:
        x86_64:
          env:
            RUNTIME: linux-x64
        aarch64:
          env:
            RUNTIME: linux-arm64
    build-commands:
      - cd engine && dotnet publish --source ./nuget-sources -c Release -p:TargetPlatform=$RUNTIME -p:CopyGenericLauncher=TRUE -p:CopyCncDll=FALSE -p:CopyD2kDll=FALSE -o ${FLATPAK_DEST}/lib/openhv --runtime $RUNTIME --self-contained true
      - mkdir bin && cd engine && ./configure-system-libraries.sh && mv bin/*.so /app/lib/openhv/
      - dotnet publish --source ./nuget-sources -c Release -o ${FLATPAK_DEST}/lib/openhv --self-contained true
      - make install-executables install-metadata install-data prefix=${FLATPAK_DEST}
    sources:
      - type: git
        url: https://github.com/OpenRA/OpenRA
        tag: playtest-20261026
        commit: d66f9bb0d0bf6de2d702360f4ec405226ed4b7f0
        dest: engine
      - type: shell
        commands:
          - cd engine && make version VERSION=playtest-20261026
          - cd engine && sed -i 's|rm "bin/\${REPLACE}"|rm -f "bin/${REPLACE}"|' configure-system-libraries.sh # https://github.com/OpenRA/OpenRA/pull/22713
      - type: file
        url: https://github.com/OpenRA/GeoIP-Database/releases/download/monthly/IP2LOCATION-LITE-DB1.IPV6.BIN.ZIP
        dest: engine
        sha256: 0f3ee961ad4211ada01294d829598ce71d4bcc75f90d43d6f05606ad18582326
      - openra-x64-nuget.json
      - openra-arm64-nuget.json

      - type: git
        url: https://github.com/OpenHV/OpenHV
        tag: '20261108'
        commit: f3252de40b09209f1fbc7f16ba7c4136d30dd4b3
      - type: shell
        commands:
          - make version
      - openhv-nuget.json
